  Learn Input in HTML

<body>
    <h1>Forgot Password Page</h1>
    <label for="email">email:</label><br>
    <input type="email" placeholder="email" required>
    <br>
    <label for="new password">new password:</label><br>
    <input type="new Password" id="new password" placeholder="Enter your new password" required>

    <input type="confirm your new Password" id="confirm your new password" placeholder="Confirm your new password" required>

    <input type="submit" value="submit">
    <br>
  
</body>
